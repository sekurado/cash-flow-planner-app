repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.18
    hooks:
      - id: ruff-format
      - id: ruff-check

  - repo: local
    hooks:
      - id: mypy
        name: mypy
        entry: mypy --strict src/
        language: system
        types: [python]
        pass_filenames: false
